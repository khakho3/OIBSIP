<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, persistent daily task manager." />
    <title>Dayflow — To-do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Daily focus</p>
        <h1>Make today <em>count.</em></h1>
        <p class="intro">A calm place for the things you want to get done.</p>
      </header>

      <section class="composer" aria-labelledby="add-heading">
        <h2 id="add-heading" class="sr-only">Add a task</h2>
        <form id="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input id="task-input" name="task" type="text" maxlength="160" placeholder="What needs your attention?" autocomplete="off" required />
          <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
        </form>
      </section>

      <div class="lists-grid">
        <section class="task-section pending-section" aria-labelledby="pending-heading">
          <div class="section-heading">
            <div><p class="section-kicker">On your list</p><h2 id="pending-heading">Pending</h2></div>
            <span id="pending-count" class="count" aria-live="polite">0 pending</span>
          </div>
          <ul id="pending-list" class="task-list" aria-label="Pending tasks"></ul>
        </section>

        <section class="task-section completed-section" aria-labelledby="completed-heading">
          <div class="section-heading">
            <div><p class="section-kicker">Already done</p><h2 id="completed-heading">Completed</h2></div>
            <span id="completed-count" class="count" aria-live="polite">0 completed</span>
          </div>
          <ul id="completed-list" class="task-list" aria-label="Completed tasks"></ul>
        </section>
      </div>
    </main>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
