<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Aziz Tech Org</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="brand-panel" aria-label="Create an account">
        <p class="eyebrow">AZIZ TECH ORG</p>
        <h1>Your space, ready when you are.</h1>
        <p>Create an account to get started.</p>
      </section>
      <section class="form-panel">
        <div class="form-card">
          <p class="eyebrow">GET STARTED</p>
          <h2>Create account</h2>
          <p class="muted">Your password needs 8+ characters and at least one number.</p>
          <form id="registerForm" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />
            <p id="formMessage" class="message" role="alert" aria-live="polite"></p>
            <button type="submit">Create account</button>
          </form>
          <p class="switch-copy">Already registered? <a href="index.html">Sign in</a></p>
        </div>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
